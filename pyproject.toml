[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweepr"
version = "0.0.1"
description = "A self-healing supervisor for ML training sweeps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
supervise = "sweepr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sweepr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
